# R009 Stage 2 Packaging：electron-builder 配置（§2.1 选型 electron-builder，不迁 Electron Forge——
# 现有 Vite + esbuild 自定义主进程构建已满足产物要求，无需为打包重构 build 架构）。
# 选独立 yml 而非 package.json "build" 字段：JSON 不支持注释，而未签名、图标缺省、
# asar 策略等决策需要随配置留痕；同时避免 package.json 继续膨胀。

# R009 Stage 1 冻结的产品身份（G2）。
appId: com.e1.notes
productName: E1

directories:
  # 打包产物输出到项目内 release/（已 gitignore），符合「一切产物只在项目内」约定。
  output: release

# §2.3 打包内容：vite 渲染产物（多页 index.html + desktop.html）+ esbuild 主进程/预加载产物。
# package.json 由 electron-builder 默认必带；production node_modules（dependencies，
# 含运行时依赖 chokidar）由 electron-builder 自动收集，无需显式列出。
files:
  - dist/**
  - dist-electron/**

# §2.4：asar 默认即为 true，此处显式声明以固定策略。先全量 asar——chokidar 4 为纯
# ESM JS（监听的是 Vault 真实路径而非 asar 内路径）、node:sqlite / safeStorage /
# e1-asset:// 均为 Node/Electron 内建或协议注册，均无需 unpack。
# 如遇 native/path 问题再按最小范围加 asarUnpack，禁止一开始全量 unpack。
asar: true

# 无 native 依赖（chokidar 4 纯 JS），跳过 node-gyp rebuild，避免本机/CI 工具链差异。
npmRebuild: false

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  # 无签名证书（R009 头部已记录签名/公证延期到 Stage 4）：identity: null 跳过
  # codesign，不触发 notarize。Stage 4 接入证书后移除此行。
  identity: null
  # 图标：暂无产品图标资源，使用 Electron 默认图标，不为此造资源；
  # 设计资源就绪后在 mac.icon / win.icon / nsis.installerIcon 配置替换。

win:
  # NSIS 安装包，仅配置供 CI 构建（本机为 macOS，不出 Windows 包）。
  target:
    - nsis

nsis:
  # 允许用户选择安装目录（oneClick 关闭的安装向导）。
  oneClick: false
  allowToChangeInstallationDirectory: true
