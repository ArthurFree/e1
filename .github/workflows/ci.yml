name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 与本地开发主版本一致（本地 v24，见 package-lock / engines 推断）
          node-version: 24
          cache: npm
      - run: npm ci
      # 质量门禁：typecheck + lint + deps:check + 单元/组件测试
      # （不含 wall-clock perf、不含生产构建、不含 E2E）
      - run: npm run ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web

  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: |
            dist
            dist-electron
          if-no-files-found: error

  # R008 Stage 0（§7.4）：production 裁剪后的 runtime 依赖 sanity——
  # Main bundle 的 external（chokidar 等）必须在 dependencies 中，
  # prune --omit=dev 后仍可解析（不启动 GUI，只做 module resolution）。
  # prune 会改动 node_modules，故独立 job，不影响其他 job。
  desktop-runtime-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - run: npm prune --omit=dev
      - name: 验证 Main bundle 全部 external runtime dependency 可解析
        run: >
          node --input-type=module -e "
          import { readFile } from 'node:fs/promises';
          const src = await readFile('scripts/build-electron.mjs', 'utf8');
          const names = new Set();
          for (const m of src.matchAll(/external:\s*\[([^\]]*)\]/g))
            for (const p of m[1].matchAll(/\"([^\"]+)\"/g)) names.add(p[1]);
          names.delete('electron');
          for (const name of names) await import(name);
          console.log('external runtime deps resolved:', [...names].join(', '));
          "

  e2e-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 安装到 Playwright 默认缓存路径（不使用项目内 PLAYWRIGHT_BROWSERS_PATH=0）
      - run: npx playwright install --with-deps chromium
      # 只跑功能与响应式用例；视觉截图基线（visual*.spec.ts）在 macOS 生成，
      # Linux 渲染差异必然失败，不纳入 CI。
      # 注意：视觉截图基线变化必须人工审查，不在 CI 自动更新。
      # Playwright webServer 走 vite dev，不依赖 build-web 产物。
      - run: >
          npx playwright test e2e/app.spec.ts e2e/responsive.spec.ts
          --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-web-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  e2e-desktop:
    runs-on: ubuntu-latest
    needs: build-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: desktop-dist
          path: .
      # 缺产物在 CI 必须失败（requireDesktopArtifacts），不做 test.skip
      - run: |
          test -f dist/desktop.html
          test -f dist-electron/main.mjs
          test -f dist-electron/preload.cjs
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npx playwright install --with-deps chromium
      # Electron 无头 Linux 经 xvfb；只跑黄金路径（打开 Vault / 保存重启 / 附件重启）
      - run: xvfb-run -a npm run test:e2e:desktop:golden -- --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-desktop-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
