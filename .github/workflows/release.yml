# R009 Stage 5：Release Workflow（docs/requirements/R009-desktop-release-readiness-distribution.md §Stage 5 / §8）
#
# 触发：git tag vX.Y.Z（与 package.json version 强一致，不一致直接失败，防发错版）。
# 流程：version-check → quality → build-verify → package(mac arm64 / win x64) → checksums → GitHub Release。
# 与普通 PR CI（ci.yml，验证 Source Correctness）分离——本 workflow 验证 Distribution Correctness。
#
# 首版分发范围（§Release Artifact「mac universal 可决定」）：只做 macOS arm64 + Windows x64，
# 不出 mac x64 / universal——当前开发机与目标用户均为 Apple Silicon，扩大矩阵等有真实需求再加。

name: Release

on:
  push:
    tags:
      - "v*"

# 最小权限：仅创建/更新 GitHub Release 需要 contents: write
permissions:
  contents: write

# 同一 tag 重复推送不并发跑两次发布
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 版本一致性门禁 ─────────────────────────────────────────────
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 tag 版本与 package.json version 一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag: ${TAG_VERSION} / package.json: ${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v${TAG_VERSION} 与 package.json version ${PKG_VERSION} 不一致，请先 bump 版本再打 tag"
            exit 1
          fi

  # ── 质量门禁（与 ci.yml quality 同口径：typecheck + lint + deps:check + 单元/组件测试）──
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 与 ci.yml / 本地开发主版本一致
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci

  # ── 构建校验：产物可构建 + production 裁剪后运行时依赖仍可解析（分发场景无 devDependencies）──
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      # 同 ci.yml desktop-runtime-deps：omit=dev 裁剪后 chokidar 等 Main external 仍可解析
      - run: npm prune --omit=dev
      - run: node scripts/verifyElectronRuntimeDeps.mjs --resolve

  # ── 矩阵打包：macOS arm64（dmg+zip）/ Windows x64（nsis exe）────────────────
  package:
    needs: [version-check, quality, build-verify]
    # 单平台失败不取消另一平台，便于分别重试（Windows 首跑见下方注释）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon runner → 产物为 arm64
            target: mac
            script: dist:mac
          - os: windows-latest
            target: win
            script: dist:win
    runs-on: ${{ matrix.os }}
    env:
      # electron-builder 缓存收口到 workspace 内，供 actions/cache 统一缓存；
      # Windows 首跑会下载 nsis / winCodeSign（Stage 2 偏差记录），缓存命中后秒级。
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      # ── 签名 secrets（当前未配置 → 全部为空 → 出未签名包，见下方签名步骤注释）──
      # macOS：Developer ID 证书（base64 p12）+ App Store Connect API Key（notarytool 公证）
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # Windows：Authenticode 证书（electron-builder 检测到 WIN_CSC_LINK 即自动签名，
      # 无需额外步骤；未配置则出未签名包，Stage 4 有明确延期记录）。
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 缓存 electron-builder 下载（nsis / winCodeSign / electron 二进制）
        uses: actions/cache@v4
        with:
          path: .cache/electron-builder
          key: electron-builder-${{ matrix.target }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-builder-${{ matrix.target }}-
      - run: npm ci

      # ── macOS 签名与公证（条件步骤：secrets 齐备才执行，默认整体跳过）──────────
      # 现状：无签名证书，electron-builder.yml 固定 `identity: null`（未签名不公证），
      # 本步跳过 → dist:mac 出未签名包，release 照常完成。
      # Stage 4 接入证书后（在仓库 Secrets 配置上述 5 个 MAC_/APPLE_ secret），本步自动生效：
      #   1) 移除 identity: null，恢复 electron-builder 默认 codesign 流程；
      #   2) APPLE_API_KEY 约定为 .p8 文件路径，故把 secret 内容落 $RUNNER_TEMP（不进入产物/日志）；
      #   3) electron-builder 检测到 CSC_LINK + APPLE_API_KEY* 后自动签名并经 notarytool 公证。
      # 注意：secrets 上下文不能直接出现在 if 中，故经 job env 中转后判空。
      - name: 启用 macOS 签名与公证（secrets 存在才执行）
        if: ${{ matrix.target == 'mac' && env.MAC_CERT_P12_BASE64 != '' && env.APPLE_API_KEY != '' }}
        run: |
          sed -i '' '/^  identity: null$/d' electron-builder.yml
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "CSC_LINK=$MAC_CERT_P12_BASE64"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"

      # --publish never：发布统一由 release job 的 action-gh-release 完成，
      # electron-builder 只出安装包，禁止它自行创建/上传 GitHub Release。
      - name: 打包（${{ matrix.target }}）
        run: npm run ${{ matrix.script }} -- --publish never

      # 统一产物命名（§Release Artifact）：nsis 默认产物名带空格（"E1 Setup x.y.z.exe"），
      # 规范化为 E1-Setup-x.y.z-x64.exe；mac 产物 E1-x.y.z-arm64.{dmg,zip} 已符合约定。
      - name: 规范化 Windows 产物名
        if: ${{ matrix.target == 'win' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          for f in release/E1\ Setup\ *.exe; do
            [ -e "$f" ] || continue
            mv "$f" "release/E1-Setup-${VERSION}-x64.exe"
          done

      # ── R009 Stage 3 / G5：安装包级 E2E（Packaged App Verification）──────────
      # 直接对磁盘上的 release/mac-arm64/E1.app 跑安装包冒烟套件（8 例 P01–P08），
      # 用 _electron.launch(executablePath) 起真实安装产物，全程不依赖仓库 node_modules——
      # 避免 repo 环境掩盖安装后缺失 runtime dependency 的问题。
      # 不需要 Playwright 浏览器二进制（驱动的是打包内 Electron）；macos runner 自带 GUI，
      # 无需 xvfb。P08 Reveal 仅 macOS 跑、P07 secrets 按 safeStorage 实测分流，均可直接运行。
      # 产物缺失时 requirePackagedArtifact() 在 CI（CI=true 由 runner 自动注入）抛错、
      # 本地 skip——此处位于打包步骤之后，产物必然存在。
      # Windows 腿暂不跑：win 安装包产物路径约定（resolvePackagedExecutable）尚未落地，
      # Stage 3 后续补齐后移除本 if 即可扩展。
      - name: 安装包冒烟 E2E（macOS）
        if: ${{ matrix.target == 'mac' }}
        run: npm run test:e2e:package
      # 失败时上传测试日志便于排障（同 ci.yml e2e-desktop 手法）
      - name: 上传安装包 E2E 失败日志
        if: ${{ matrix.target == 'mac' && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-package-results-${{ matrix.target }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      # 只上传安装包本体；blockmap / latest*.yml 是 electron-updater 增量更新元数据，
      # Auto Update 延期（R009 §Stage 6），首版不随 Release 分发，避免误导。
      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  # ── 汇总产物 + SHA256SUMS.txt + GitHub Release ───────────────────────────
  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: 生成 SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd artifacts
          for f in *.dmg *.zip *.exe; do
            [ -e "$f" ] || continue
            shasum -a 256 "$f"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          # tag 即触发源，action 默认按 GITHUB_REF 对应 tag 创建 Release
          files: artifacts/**
          fail_on_unmatched_files: true
          generate_release_notes: true
