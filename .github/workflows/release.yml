# R013：macOS Signing & Trust Release Workflow
# （承接 R009 Stage 5，去掉 unsigned fallback）
#
# 触发：git tag vX.Y.Z（与 package.json version 强一致）。
# 流程：version-check → quality → build-verify → signing-preflight
#      → Developer ID import → signed/notarized package
#      → trust verification → packaged E2E → SHA256SUMS → GitHub Release。
#
# TRUST-01/02：签名或公证凭证缺失、签名失败、公证非 Accepted、
# staple/Gatekeeper 失败一律阻断，不得降级 unsigned 发布。

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 tag 版本与 package.json version 一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag: ${TAG_VERSION} / package.json: ${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v${TAG_VERSION} 与 package.json version ${PKG_VERSION} 不一致，请先 bump 版本再打 tag"
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci

  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - run: npm prune --omit=dev
      - run: node scripts/verifyElectronRuntimeDeps.mjs --resolve

  signing-preflight:
    runs-on: ubuntu-latest
    env:
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 检查签名与公证凭证（只输出 yes/no）
        run: npm run signing:preflight

  package:
    needs: [version-check, quality, build-verify, signing-preflight]
    runs-on: macos-latest
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      E1_RELEASE_SIGNING: "1"
      E1_REQUIRE_SIGNED: "1"
      E1_EXPECTED_TEAM_IDENTIFIER: ${{ secrets.E1_EXPECTED_TEAM_IDENTIFIER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 缓存 electron-builder 下载（electron 二进制等）
        uses: actions/cache@v4
        with:
          path: .cache/electron-builder
          key: electron-builder-mac-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-builder-mac-
      - run: npm ci

      - name: 导入 Developer ID 到临时 Keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/importMacSigningIdentity.sh

      - name: 打包并签名公证（macOS arm64）
        run: npm run dist:mac -- --publish never

      - name: 清理临时 Keychain 与凭证文件
        if: ${{ always() }}
        run: bash scripts/cleanupMacSigningIdentity.sh
      - name: 从后续步骤剥离签名环境变量
        if: ${{ always() }}
        run: bash scripts/clearMacSigningEnv.sh

      - name: 校验签名身份与 Hardened Runtime
        run: npm run verify:mac-signing
      - name: 校验 entitlement 白名单
        run: npm run verify:mac-entitlements
      - name: 校验公证 / stapling / Gatekeeper / DMG / ZIP
        run: npm run verify:mac-distribution

      - name: 安装包冒烟 E2E（signed + notarized）
        run: npm run test:e2e:package
      - name: 上传安装包 E2E 失败日志
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-package-results-mac
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: 拒绝上传凭证类文件
        run: |
          set -euo pipefail
          if find artifacts \( -iname '*.p12' -o -iname '*.p8' -o -iname '*keychain*' \) | grep -q .; then
            echo "::error::artifact 中出现证书/密钥材料，拒绝发布"
            exit 1
          fi
          for z in artifacts/*.zip; do
            [ -e "$z" ] || continue
            if unzip -l "$z" | grep -Eiq '\.(p12|p8)$|keychain'; then
              echo "::error::$z 内含证书/密钥材料，拒绝发布"
              exit 1
            fi
          done
      - name: 生成 SHA256SUMS.txt（最终 signed/notarized 产物）
        run: |
          set -euo pipefail
          cd artifacts
          for f in *.dmg *.zip; do
            [ -e "$f" ] || continue
            shasum -a 256 "$f"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          fail_on_unmatched_files: true
          generate_release_notes: true
